<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SNG Portal - Quiz conduite RD en français et espagnol.">
  <title>SNG Portal - Conduite RD</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      padding: 30px;
      border-radius: 20px;
      width: min(100%, 430px);
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 22px;
    }

    .question {
      margin: 20px 0;
      font-size: 18px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 5px 0;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      transition: 0.3s;
      font-size: 15px;
    }

    button:hover {
      background: #00c6ff;
      color: black;
    }

    .progress {
      margin-top: 15px;
    }

    progress {
      width: 100%;
      height: 10px;
    }

    .score {
      margin-top: 15px;
      font-weight: bold;
    }

    .lang {
      margin-bottom: 10px;
    }

    .lang button {
      width: auto;
      padding: 6px 12px;
      margin: 2px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🚗 SNG Portal - Conduite RD</h1>

  <div class="lang">
    <button onclick="setLang('fr')">🇫🇷 FR</button>
    <button onclick="setLang('es')">🇪🇸 ES</button>
  </div>

  <div class="question" id="question"></div>

  <div id="answers"></div>

  <div class="progress">
    <span id="progressText">0%</span>
    <progress id="progressBar" value="0" max="100"></progress>
  </div>

  <div class="score" id="score"></div>
</div>

<script>
const quiz = [
  {
    q_fr: "Que faire à un stop ?",
    q_es: "¿Qué hacer en una señal de stop?",
    answers_fr: ["Ralentir", "S'arrêter complètement", "Continuer"],
    answers_es: ["Reducir", "Detenerse completamente", "Continuar"],
    correct: 1
  },
  {
    q_fr: "Que signifie un feu rouge ?",
    q_es: "¿Qué significa un semáforo en rojo?",
    answers_fr: ["Passer", "Ralentir", "S'arrêter"],
    answers_es: ["Pasar", "Reducir", "Detenerse"],
    correct: 2
  },
  {
    q_fr: "Qui a la priorité ?",
    q_es: "¿Quién tiene prioridad?",
    answers_fr: ["Celui à droite", "Celui à gauche", "Personne"],
    answers_es: ["El de la derecha", "El de la izquierda", "Nadie"],
    correct: 0
  },
  {
    q_fr: "Que faire avant de tourner ?",
    q_es: "¿Qué hacer antes de girar?",
    answers_fr: ["Accélérer", "Mettre le clignotant", "Freiner fort"],
    answers_es: ["Acelerar", "Poner direccional", "Frenar fuerte"],
    correct: 1
  }
];

let index = 0;
let score = 0;
let lang = 'es';

function setLang(l) {
  lang = l;
  loadQuestion();
}

function loadQuestion() {
  const q = quiz[index];
  document.getElementById('question').innerText = (lang === 'fr') ? q.q_fr : q.q_es;

  const answersDiv = document.getElementById('answers');
  answersDiv.innerHTML = '';

  const answers = (lang === 'fr') ? q.answers_fr : q.answers_es;

  answers.forEach((ans, i) => {
    const btn = document.createElement('button');
    btn.innerText = ans;
    btn.onclick = () => checkAnswer(i);
    answersDiv.appendChild(btn);
  });
}

function checkAnswer(i) {
  if (i === quiz[index].correct) score++;
  index++;
  updateProgress();

  if (index < quiz.length) loadQuestion();
  else endQuiz();
}

function updateProgress() {
  const percent = (index / quiz.length) * 100;
  document.getElementById('progressBar').value = percent;
  document.getElementById('progressText').innerText = Math.round(percent) + '%';
}

function endQuiz() {
  document.getElementById('question').innerText = (lang === 'fr') ? '🎉 Quiz terminé' : '🎉 Quiz terminado';
  document.getElementById('answers').innerHTML = '';
  document.getElementById('score').innerText = 'Score: ' + score + ' / ' + quiz.length;
}

loadQuestion();
</script>

</body>
</html>
