<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sng-subway-runner-pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/framer-motion/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;
    const { motion, AnimatePresence } = window["framer-motion"];

    const Icon = ({ children, className = "" }) => <span className={`inline-flex items-center justify-center ${className}`}>{children}</span>;
    const Play = (p) => <Icon {...p}>▶</Icon>;
    const RotateCcw = (p) => <Icon {...p}>↺</Icon>;
    const Trophy = (p) => <Icon {...p}>🏆</Icon>;
    const Coins = (p) => <Icon {...p}>🪙</Icon>;
    const Zap = (p) => <Icon {...p}>⚡</Icon>;
    const Shield = (p) => <Icon {...p}>🛡</Icon>;
    const ArrowLeft = (p) => <Icon {...p}>←</Icon>;
    const ArrowRight = (p) => <Icon {...p}>→</Icon>;
    const ArrowUp = (p) => <Icon {...p}>↑</Icon>;
    const ArrowDown = (p) => <Icon {...p}>↓</Icon>;
    const Sparkles = (p) => <Icon {...p}>✨</Icon>;

    const Button = ({ className = "", children, ...props }) => <button className={`inline-flex items-center justify-center px-4 py-2 ${className}`} {...props}>{children}</button>;
    const Card = ({ className = "", children }) => <div className={`border ${className}`}>{children}</div>;
    const CardContent = ({ className = "", children }) => <div className={className}>{children}</div>;
    const Badge = ({ className = "", children }) => <span className={`inline-flex items-center ${className}`}>{children}</span>;
    const Progress = ({ value = 0, className = "" }) => (
      <div className={`w-full overflow-hidden rounded-full ${className}`}>
        <div className="h-full rounded-full bg-orange-400 transition-all" style={{ width: `${Math.max(0, Math.min(100, value))}%` }} />
      </div>
    );

    const LANES = [-1, 0, 1];
    const GAME_WIDTH = 920;
    const GAME_HEIGHT = 620;
    const TRACK_LEFT = 170;
    const TRACK_WIDTH = 580;
    const LANE_WIDTH = TRACK_WIDTH / 3;
    const PLAYER_Y = 470;
    const PLAYER_W = 86;
    const PLAYER_H = 116;
    const GROUND_SPEED_START = 16;
    const SEGMENT_LENGTH = 140;
    const MAX_LIVES = 1;

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function laneToX(lane) { return TRACK_LEFT + TRACK_WIDTH / 2 + lane * LANE_WIDTH; }

    function makeRow(z, difficulty = 1) {
      const obstacleChance = Math.min(0.3 + difficulty * 0.015, 0.58);
      const coinChance = 0.75;
      const trainChance = Math.min(0.08 + difficulty * 0.01, 0.18);
      const row = { id: `${z}-${Math.random().toString(36).slice(2, 8)}`, z, obstacles: [], coins: [], powerup: null };
      const freeLane = LANES[rand(0, 2)];
      LANES.forEach((lane) => {
        if (Math.random() < obstacleChance && lane !== freeLane) row.obstacles.push({ id: `${row.id}-obs-${lane}`, lane, type: Math.random() < trainChance ? "train" : Math.random() < 0.5 ? "barrier" : "cone" });
        if (Math.random() < coinChance) row.coins.push({ id: `${row.id}-coin-${lane}`, lane, height: Math.random() < 0.2 ? "high" : "normal" });
      });
      if (Math.random() < 0.08) row.powerup = { id: `${row.id}-power`, lane: freeLane, type: Math.random() < 0.5 ? "magnet" : "shield" };
      return row;
    }

    function buildInitialRows() { const rows = []; for (let i = 0; i < 22; i++) rows.push(makeRow(i * SEGMENT_LENGTH, 1)); return rows; }

    function Skyline() { return <div className="absolute inset-0 overflow-hidden rounded-[32px]"><div className="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(255,180,120,0.45),_transparent_35%),linear-gradient(180deg,#101726_0%,#13233e_40%,#1d3457_70%,#27466d_100%)]" /><div className="absolute inset-x-0 top-10 h-56 opacity-60">{[...Array(20)].map((_, i) => <div key={i} className="absolute bottom-0 rounded-t-2xl bg-white/10" style={{ left: `${i * 5.2}%`, width: `${3 + (i % 3)}%`, height: `${70 + ((i * 31) % 120)}px`, filter: "blur(0.4px)" }}><div className="grid grid-cols-3 gap-1 p-2">{[...Array(12)].map((__, j) => <div key={j} className={`h-1.5 rounded-full ${j % 4 === 0 ? "bg-amber-300/70" : "bg-white/20"}`} />)}</div></div>)}</div><div className="absolute inset-x-0 bottom-0 h-56 bg-[linear-gradient(180deg,transparent,rgba(0,0,0,0.26))]" /></div>; }

    function TrainTracks({ speed }) { const lineCount = 11; return <div className="absolute inset-0">{[...Array(lineCount)].map((_, i) => <div key={i} className="absolute left-1/2 -translate-x-1/2 rounded-3xl border border-white/5 bg-slate-900/45" style={{ bottom: `${i * 58 - (speed % 58)}px`, width: `${210 + i * 48}px`, height: `${34 + i * 10}px`, transform: `translateX(-50%) perspective(900px) rotateX(68deg)`, boxShadow: "inset 0 1px 0 rgba(255,255,255,0.08)" }} />)}{[0,1,2,3].map((rail)=> <div key={rail} className="absolute top-0 bottom-0 w-1 rounded-full bg-white/20" style={{ left: `${TRACK_LEFT + rail * (TRACK_WIDTH / 3)}px` }} />)}</div>; }

    function Runner({ lane, jumping, sliding, shield }) {
      const x = laneToX(lane); const y = PLAYER_Y - (jumping ? 90 : 0) + (sliding ? 30 : 0); const scaleY = sliding ? 0.68 : 1;
      return <motion.div className="absolute" animate={{ left: x - PLAYER_W / 2, top: y - PLAYER_H / 2, scaleY }} transition={{ type: "spring", stiffness: 240, damping: 18 }} style={{ width: PLAYER_W, height: PLAYER_H }}><div className="relative h-full w-full">{shield && <motion.div className="absolute inset-[-10px] rounded-[32px] border border-cyan-300/60 bg-cyan-300/10" animate={{ scale: [1, 1.06, 1], opacity: [0.35, 0.65, 0.35] }} transition={{ repeat: Infinity, duration: 1.2 }} /> }<div className="absolute left-1/2 top-1 -translate-x-1/2 h-8 w-8 rounded-full bg-amber-200 shadow-lg shadow-amber-200/30" /><div className="absolute left-1/2 top-8 -translate-x-1/2 h-12 w-10 rounded-2xl bg-slate-900/90" /><div className="absolute left-1/2 top-16 -translate-x-1/2 h-14 w-14 rounded-[22px] bg-orange-500 shadow-xl shadow-orange-500/30" /><div className="absolute left-1/2 top-24 -translate-x-1/2 h-16 w-16 rounded-[24px] bg-emerald-400/95" /><div className="absolute left-[8px] top-28 h-12 w-4 rounded-full bg-orange-400" /><div className="absolute right-[8px] top-28 h-12 w-4 rounded-full bg-orange-400" /><div className="absolute left-[20px] bottom-0 h-14 w-5 rounded-full bg-slate-950" /><div className="absolute right-[20px] bottom-0 h-14 w-5 rounded-full bg-slate-950" /></div></motion.div>;
    }

    function Obstacle({ lane, z, type }) { const scale = clamp(1.5 - z / 900, 0.4, 1.4); const y = 120 + (1 - scale) * 360 + z * 0.08; const x = laneToX(lane); const width = type === "train" ? 120 * scale : 74 * scale; const height = type === "train" ? 210 * scale : type === "barrier" ? 75 * scale : 55 * scale; return <div className="absolute" style={{ left: x - width / 2, top: y, width, height, zIndex: Math.round(1000 - z) }}>{type === "train" ? <div className="h-full w-full rounded-[28px] border border-white/10 bg-gradient-to-b from-sky-400 via-sky-500 to-sky-700 shadow-2xl shadow-sky-950/40"><div className="mx-auto mt-4 h-6 w-3/4 rounded-full bg-white/30" /><div className="mt-4 grid grid-cols-2 gap-2 px-3">{[...Array(6)].map((_, i) => <div key={i} className="h-5 rounded-lg bg-white/30" />)}</div><div className="absolute inset-x-3 bottom-3 h-4 rounded-full bg-yellow-300/60" /></div> : type === "barrier" ? <div className="h-full w-full rounded-[18px] border border-white/10 bg-gradient-to-b from-red-400 to-red-700 shadow-xl shadow-red-950/40"><div className="mt-2 grid gap-2 px-2">{[...Array(3)].map((_, i) => <div key={i} className="h-2 rounded-full bg-white/70" />)}</div></div> : <div className="h-full w-full rounded-[18px] border border-white/10 bg-gradient-to-b from-orange-300 to-orange-600 shadow-xl shadow-orange-950/40"><div className="mx-auto mt-2 h-2 w-10 rounded-full bg-white/70" /></div>}</div>; }

    function Coin({ lane, z, magnet }) { const scale = clamp(1.45 - z / 900, 0.4, 1.3); const y = 180 + (1 - scale) * 300 + z * 0.08; const x = laneToX(lane); return <motion.div className="absolute flex items-center justify-center rounded-full border border-yellow-100/40 bg-gradient-to-b from-yellow-200 to-amber-500 font-black text-amber-950 shadow-lg" animate={magnet ? { scale: [scale, scale * 1.14, scale], rotate: [0, 8, -8, 0] } : { rotateY: [0, 180, 360] }} transition={{ repeat: Infinity, duration: magnet ? 0.8 : 1.8, ease: "linear" }} style={{ left: x - 18 * scale, top: y, width: 36 * scale, height: 36 * scale, zIndex: Math.round(1000 - z) }}>S</motion.div>; }

    function PowerUp({ lane, z, type }) { const scale = clamp(1.45 - z / 900, 0.4, 1.3); const y = 220 + (1 - scale) * 280 + z * 0.08; const x = laneToX(lane); return <motion.div className={`absolute rounded-2xl border shadow-xl ${type === "magnet" ? "border-fuchsia-300/50 bg-fuchsia-500/80" : "border-cyan-300/50 bg-cyan-500/80"}`} animate={{ y: [0, -8, 0], rotate: [0, 6, -6, 0] }} transition={{ repeat: Infinity, duration: 1.2 }} style={{ left: x - 25 * scale, top: y, width: 50 * scale, height: 50 * scale, zIndex: Math.round(1000 - z) }}><div className="flex h-full w-full items-center justify-center text-white">{type === "magnet" ? <Zap className="h-5 w-5" /> : <Shield className="h-5 w-5" />}</div></motion.div>; }

    function SNGSubwayRunnerPro() {
      const [started, setStarted] = useState(false), [gameOver, setGameOver] = useState(false), [score, setScore] = useState(0), [best, setBest] = useState(0), [coins, setCoins] = useState(0), [lane, setLane] = useState(0), [jumping, setJumping] = useState(false), [sliding, setSliding] = useState(false), [speed, setSpeed] = useState(GROUND_SPEED_START), [distance, setDistance] = useState(0), [rows, setRows] = useState(buildInitialRows()), [shieldUntil, setShieldUntil] = useState(0), [magnetUntil, setMagnetUntil] = useState(0), [flash, setFlash] = useState(false), [mission, setMission] = useState({ target: 100, reward: 30 });
      const rafRef = useRef(null), lastTimeRef = useRef(0), scoreRef = useRef(0), distanceRef = useRef(0);
      const now = Date.now(); const shieldActive = shieldUntil > now; const magnetActive = magnetUntil > now; const missionProgress = Math.min((coins / mission.target) * 100, 100);

      useEffect(() => setBest(Number(localStorage.getItem("sng-subway-best") || 0)), []);
      useEffect(() => { scoreRef.current = score; distanceRef.current = distance; }, [score, distance]);

      const resetGame = () => { setStarted(false); setGameOver(false); setScore(0); setCoins(0); setLane(0); setJumping(false); setSliding(false); setSpeed(GROUND_SPEED_START); setDistance(0); setRows(buildInitialRows()); setShieldUntil(0); setMagnetUntil(0); setFlash(false); setMission({ target: rand(80, 150), reward: rand(25, 45) }); lastTimeRef.current = 0; };
      useEffect(() => { resetGame(); }, []);

      const moveLeft = () => setLane((l) => clamp(l - 1, -1, 1)); const moveRight = () => setLane((l) => clamp(l + 1, -1, 1));
      const triggerJump = () => { if (jumping || !started || gameOver) return; setJumping(true); setTimeout(() => setJumping(false), 620); };
      const triggerSlide = () => { if (sliding || !started || gameOver) return; setSliding(true); setTimeout(() => setSliding(false), 520); };

      useEffect(() => {
        const onKey = (e) => {
          if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
          if (!started && (e.key === " " || e.key === "Enter")) setStarted(true);
          if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") moveLeft();
          if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") moveRight();
          if (e.key === "ArrowUp" || e.key.toLowerCase() === "w" || e.key === " ") triggerJump();
          if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") triggerSlide();
        };
        window.addEventListener("keydown", onKey); return () => window.removeEventListener("keydown", onKey);
      }, [started, jumping, sliding, gameOver]);

      useEffect(() => {
        if (!started || gameOver) return;
        const tick = (t) => {
          if (!lastTimeRef.current) lastTimeRef.current = t;
          const dt = Math.min((t - lastTimeRef.current) / 16.6667, 1.4); lastTimeRef.current = t;
          setDistance((d) => d + speed * dt * 0.5); setScore((s) => s + Math.floor(speed * dt * 0.9)); setSpeed((s) => Math.min(s + 0.0025 * dt, 30));
          setRows((prev) => {
            let next = prev.map((row) => ({ ...row, z: row.z - speed * dt * 10, obstacles: row.obstacles.filter(Boolean), coins: row.coins.filter(Boolean) })).filter((row) => row.z > -120);
            while (next.length < 22) { const lastZ = next.length ? next[next.length - 1].z : 0; const difficulty = 1 + Math.floor(distanceRef.current / 1000); next.push(makeRow(lastZ + SEGMENT_LENGTH, difficulty)); }
            const hitWindow = (z) => z < 110 && z > -10;
            next = next.map((row) => {
              const updated = { ...row };
              updated.coins = row.coins.filter((coin) => { const sameLane = coin.lane === lane; const nearLane = magnetActive && Math.abs(coin.lane - lane) <= 1; const withinRange = row.z < 160 && row.z > 10; if ((sameLane || nearLane) && withinRange) { setCoins((c) => c + 1); setScore((s) => s + 25); return false; } return true; });
              if (row.powerup && row.powerup.lane === lane && row.z < 130 && row.z > 0) { if (row.powerup.type === "magnet") setMagnetUntil(Date.now() + 7000); if (row.powerup.type === "shield") setShieldUntil(Date.now() + 7000); setScore((s) => s + 100); updated.powerup = null; }
              const collision = row.obstacles.some((obs) => { if (obs.lane !== lane || !hitWindow(row.z)) return false; if (obs.type === "cone" && jumping) return false; if (obs.type === "barrier" && sliding) return false; return true; });
              if (collision) { if (shieldActive) { setShieldUntil(0); updated.obstacles = []; } else { setFlash(true); setTimeout(() => setFlash(false), 160); setGameOver(true); const finalScore = scoreRef.current; const bestScore = Math.max(best, finalScore); setBest(bestScore); localStorage.setItem("sng-subway-best", String(bestScore)); } }
              return updated;
            });
            return next;
          });
          rafRef.current = requestAnimationFrame(tick);
        };
        rafRef.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafRef.current);
      }, [started, gameOver, speed, lane, jumping, sliding, shieldActive, magnetActive, best]);

      useEffect(() => { if (coins >= mission.target) { setScore((s) => s + mission.reward * 10); setCoins((c) => c + mission.reward); setMission({ target: rand(120, 220), reward: rand(35, 65) }); } }, [coins, mission]);
      const renderedObjects = useMemo(() => rows.flatMap((row) => { const objs = []; row.obstacles.forEach((obs) => objs.push({ kind: "obstacle", ...obs, z: row.z, key: obs.id })); row.coins.forEach((coin) => objs.push({ kind: "coin", ...coin, z: row.z, key: coin.id })); if (row.powerup) objs.push({ kind: "powerup", ...row.powerup, z: row.z, key: row.powerup.id }); return objs; }), [rows]);

      return <div className="min-h-screen bg-[radial-gradient(circle_at_top,_#1f2b4d,_#080d16_60%)] p-4 text-white md:p-8"><div className="mx-auto max-w-[1280px]"><div className="mb-5 flex flex-col gap-4 md:flex-row md:items-center md:justify-between"><div><Badge className="mb-3 rounded-full border-0 bg-orange-500/20 px-4 py-1 text-orange-200">SNG ULTRA PRO</Badge><h1 className="text-3xl font-black tracking-tight md:text-5xl">Subway Runner <span className="text-orange-400">SNG Edition</span></h1><p className="mt-2 max-w-2xl text-sm text-slate-300 md:text-base">Version premium inspirée des endless runners urbains, optimisée pour ton site avec score, pièces, bonus, mission, écran d’accueil et commandes tactiles.</p></div><div className="grid grid-cols-2 gap-3 md:grid-cols-4"><Card className="rounded-3xl border-white/10 bg-white/5 backdrop-blur-xl"><CardContent className="p-4"><div className="text-xs text-slate-300">Score</div><div className="text-2xl font-black">{score}</div></CardContent></Card><Card className="rounded-3xl border-white/10 bg-white/5 backdrop-blur-xl"><CardContent className="p-4"><div className="text-xs text-slate-300">Meilleur</div><div className="text-2xl font-black">{best}</div></CardContent></Card><Card className="rounded-3xl border-white/10 bg-white/5 backdrop-blur-xl"><CardContent className="p-4"><div className="text-xs text-slate-300">Pièces</div><div className="flex items-center gap-2 text-2xl font-black"><Coins className="h-5 w-5 text-yellow-300" />{coins}</div></CardContent></Card><Card className="rounded-3xl border-white/10 bg-white/5 backdrop-blur-xl"><CardContent className="p-4"><div className="text-xs text-slate-300">Vitesse</div><div className="text-2xl font-black">{speed.toFixed(1)}x</div></CardContent></Card></div></div>

      <div className="grid gap-5 xl:grid-cols-[1fr_320px]"><div><div className={`relative overflow-hidden rounded-[32px] border border-white/10 bg-black/20 shadow-2xl shadow-black/40 ${flash ? "ring-4 ring-red-400/50" : ""}`} style={{ width: "100%", maxWidth: GAME_WIDTH, height: GAME_HEIGHT }}><Skyline /><TrainTracks speed={distance} /><div className="absolute inset-x-0 top-0 z-30 flex items-center justify-between p-4"><div className="rounded-2xl border border-white/10 bg-black/30 px-4 py-2 backdrop-blur-xl"><div className="text-xs text-slate-300">Distance</div><div className="text-xl font-black">{Math.floor(distance)} m</div></div><div className="flex gap-2">{shieldActive && <Badge className="rounded-full bg-cyan-400/20 px-4 py-1 text-cyan-200"><Shield className="mr-1 h-3.5 w-3.5" /> Shield</Badge>}{magnetActive && <Badge className="rounded-full bg-fuchsia-400/20 px-4 py-1 text-fuchsia-200"><Zap className="mr-1 h-3.5 w-3.5" /> Magnet</Badge>}</div></div>
      {renderedObjects.map((obj) => obj.kind === "obstacle" ? <Obstacle key={obj.key} lane={obj.lane} z={obj.z} type={obj.type} /> : obj.kind === "coin" ? <Coin key={obj.key} lane={obj.lane} z={obj.z} magnet={magnetActive} /> : <PowerUp key={obj.key} lane={obj.lane} z={obj.z} type={obj.type} />)}
      <Runner lane={lane} jumping={jumping} sliding={sliding} shield={shieldActive} />
      <div className="absolute inset-x-0 bottom-0 h-28 bg-[linear-gradient(180deg,transparent,rgba(0,0,0,0.45))]" />
      <AnimatePresence>{!started && !gameOver && <motion.div className="absolute inset-0 z-40 flex items-center justify-center bg-slate-950/45 backdrop-blur-sm" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}><Card className="mx-4 w-full max-w-xl rounded-[32px] border-white/10 bg-slate-950/70 text-white shadow-2xl shadow-black/50"><CardContent className="p-8 text-center"><div className="mx-auto mb-4 flex h-20 w-20 items-center justify-center rounded-3xl bg-orange-500/20"><Sparkles className="h-10 w-10 text-orange-400" /></div><h2 className="text-3xl font-black md:text-4xl">Lance la course SNG</h2><p className="mt-3 text-slate-300">Esquive les trains, prends les pièces, récupère les bonus et fais le meilleur score sur ton site.</p><Button className="mt-7 h-14 w-full rounded-2xl bg-orange-500 text-lg font-black hover:bg-orange-400" onClick={() => setStarted(true)}><Play className="mr-2 h-5 w-5" /> Jouer maintenant</Button></CardContent></Card></motion.div>}</AnimatePresence>
      <AnimatePresence>{gameOver && <motion.div className="absolute inset-0 z-40 flex items-center justify-center bg-slate-950/55 backdrop-blur-sm" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}><Card className="mx-4 w-full max-w-lg rounded-[32px] border-white/10 bg-slate-950/80 text-white shadow-2xl shadow-black/50"><CardContent className="p-8 text-center"><div className="mx-auto mb-4 flex h-20 w-20 items-center justify-center rounded-3xl bg-red-500/20"><Trophy className="h-10 w-10 text-yellow-300" /></div><h2 className="text-3xl font-black">Fin de course</h2><p className="mt-2 text-slate-300">Relance immédiatement et bats ton meilleur score.</p><div className="mt-6 grid grid-cols-3 gap-3"><div className="rounded-2xl border border-white/10 bg-white/5 p-4"><div className="text-xs text-slate-300">Score</div><div className="text-2xl font-black">{score}</div></div><div className="rounded-2xl border border-white/10 bg-white/5 p-4"><div className="text-xs text-slate-300">Pièces</div><div className="text-2xl font-black">{coins}</div></div><div className="rounded-2xl border border-white/10 bg-white/5 p-4"><div className="text-xs text-slate-300">Best</div><div className="text-2xl font-black">{best}</div></div></div><Button className="mt-7 h-14 w-full rounded-2xl bg-orange-500 text-lg font-black hover:bg-orange-400" onClick={resetGame}><RotateCcw className="mr-2 h-5 w-5" /> Rejouer</Button></CardContent></Card></motion.div>}</AnimatePresence>
      <div className="absolute bottom-5 left-1/2 z-30 flex -translate-x-1/2 gap-2 md:hidden"><Button className="rounded-2xl bg-black/40 backdrop-blur-xl" onClick={moveLeft}><ArrowLeft className="h-5 w-5" /></Button><Button className="rounded-2xl bg-black/40 backdrop-blur-xl" onClick={triggerJump}><ArrowUp className="h-5 w-5" /></Button><Button className="rounded-2xl bg-black/40 backdrop-blur-xl" onClick={triggerSlide}><ArrowDown className="h-5 w-5" /></Button><Button className="rounded-2xl bg-black/40 backdrop-blur-xl" onClick={moveRight}><ArrowRight className="h-5 w-5" /></Button></div></div></div>
      <div className="space-y-5"><Card className="rounded-[28px] border-white/10 bg-white/5 backdrop-blur-xl"><CardContent className="p-6"><div className="mb-2 text-sm text-slate-300">Mission active</div><div className="text-2xl font-black">Ramasse {mission.target} pièces</div><p className="mt-2 text-sm text-slate-300">Récompense: +{mission.reward} pièces bonus et gros boost de score.</p><Progress value={missionProgress} className="mt-4 h-3 bg-white/10" /><div className="mt-2 text-sm text-slate-400">{coins} / {mission.target}</div></CardContent></Card><Card className="rounded-[28px] border-white/10 bg-white/5 backdrop-blur-xl"><CardContent className="p-6"><div className="mb-3 text-sm text-slate-300">Bonus</div><div className="grid gap-3"><div className="rounded-2xl border border-white/10 bg-white/5 p-4"><div className="flex items-center gap-2 font-bold text-fuchsia-300"><Zap className="h-4 w-4" /> Magnet</div><div className="mt-1 text-sm text-slate-300">Attire les pièces autour de toi pendant 7 secondes.</div></div><div className="rounded-2xl border border-white/10 bg-white/5 p-4"><div className="flex items-center gap-2 font-bold text-cyan-300"><Shield className="h-4 w-4" /> Shield</div><div className="mt-1 text-sm text-slate-300">Encaisse une collision et continue la course.</div></div></div></CardContent></Card></div></div></div></div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<SNGSubwayRunnerPro />);
  </script>
</body>
</html>
