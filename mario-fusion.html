<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNG Subway Runner Pro</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Arial,Helvetica,sans-serif;
      background:radial-gradient(circle at top,#1f2b4d 0%,#080d16 65%);
      color:#fff;
      min-height:100vh;
      overflow:hidden;
    }
    .hud{
      position:fixed;top:18px;left:18px;right:18px;z-index:20;
      display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    }
    .logo{
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
      backdrop-filter:blur(10px);padding:12px 18px;border-radius:18px;
      font-weight:900;font-size:28px;letter-spacing:.5px;
      box-shadow:0 10px 30px rgba(0,0,0,.3);
    }
    .logo span{color:#ff9b2f}
    .stats{display:flex;gap:10px;flex-wrap:wrap}
    .card{
      min-width:110px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
      backdrop-filter:blur(10px);padding:10px 14px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)
    }
    .label{font-size:12px;color:#cbd5e1}
    .value{font-size:28px;font-weight:900}
    #game{
      position:relative;width:100vw;height:100vh;overflow:hidden;
    }
    .sky{
      position:absolute;inset:0;
      background:
        radial-gradient(circle at top, rgba(255,180,120,0.35), transparent 25%),
        linear-gradient(180deg,#101726 0%,#13233e 38%,#1d3457 65%,#27466d 100%);
    }
    .buildings{position:absolute;left:0;right:0;bottom:220px;height:260px;opacity:.7}
    .building{position:absolute;bottom:0;background:rgba(255,255,255,.08);border-radius:18px 18px 0 0;overflow:hidden}
    .windows{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:10px}
    .windows span{display:block;height:6px;border-radius:10px;background:rgba(255,255,255,.15)}
    .windows span:nth-child(4n){background:rgba(255,210,70,.8)}
    .trackWrap{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(92vw,760px);height:80vh}
    .laneMark{position:absolute;top:0;bottom:0;width:4px;background:rgba(255,255,255,.16)}
    .rail{position:absolute;left:50%;transform:translateX(-50%) perspective(900px) rotateX(68deg);border-radius:30px;background:rgba(11,15,24,.55);border:1px solid rgba(255,255,255,.05)}
    .player{
      position:absolute;bottom:115px;width:84px;height:110px;z-index:8;
      transition:left .14s ease,bottom .18s ease,transform .18s ease;
    }
    .shieldAura{position:absolute;inset:-10px;border-radius:26px;border:2px solid rgba(103,232,249,.65);box-shadow:0 0 35px rgba(103,232,249,.35);animation:pulse 1s infinite}
    .head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:#fde68a}
    .hood{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:36px;height:24px;border-radius:16px;background:#111827}
    .body{position:absolute;left:50%;top:32px;transform:translateX(-50%);width:58px;height:42px;border-radius:18px;background:#f97316}
    .legs{position:absolute;left:50%;top:62px;transform:translateX(-50%);width:64px;height:40px;border-radius:18px;background:#34d399}
    .armL,.armR,.legL,.legR{position:absolute;background:#111827;border-radius:10px}
    .armL{left:10px;top:52px;width:10px;height:34px;background:#fb923c}
    .armR{right:10px;top:52px;width:10px;height:34px;background:#fb923c}
    .legL{left:20px;bottom:0;width:12px;height:34px}
    .legR{right:20px;bottom:0;width:12px;height:34px}
    .obstacle,.coin,.power{position:absolute;transform-origin:center center}
    .train{background:linear-gradient(180deg,#38bdf8,#2563eb);border:1px solid rgba(255,255,255,.12);border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,.35)}
    .barrier{background:linear-gradient(180deg,#fb7185,#b91c1c);border-radius:16px;border:1px solid rgba(255,255,255,.12)}
    .cone{background:linear-gradient(180deg,#fdba74,#ea580c);border-radius:14px;border:1px solid rgba(255,255,255,.12)}
    .coin{
      width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,#fde68a,#f59e0b);
      color:#4a2d00;font-weight:900;display:flex;align-items:center;justify-content:center;
      box-shadow:0 8px 20px rgba(245,158,11,.35);animation:spin 1.4s linear infinite;
    }
    .power{
      width:44px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;
      box-shadow:0 10px 25px rgba(0,0,0,.25);font-size:22px;font-weight:900;
    }
    .magnet{background:rgba(217,70,239,.88);border:1px solid rgba(245,208,254,.5)}
    .shield{background:rgba(6,182,212,.88);border:1px solid rgba(165,243,252,.5)}
    .overlay{
      position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
      background:rgba(2,6,23,.5);backdrop-filter:blur(6px);
    }
    .panel{
      width:min(92vw,620px);background:rgba(2,6,23,.82);border:1px solid rgba(255,255,255,.12);
      border-radius:30px;padding:34px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.45)
    }
    .panel h1{font-size:52px;line-height:1;font-weight:900}
    .panel h1 span{color:#ff9b2f}
    .panel p{margin-top:14px;color:#cbd5e1;font-size:18px}
    .btn{
      margin-top:24px;border:none;background:#f97316;color:#fff;padding:16px 26px;border-radius:18px;
      font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 14px 35px rgba(249,115,22,.35)
    }
    .btn:hover{background:#fb923c}
    .tips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
    .tip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:14px;border-radius:18px;font-size:14px}
    .mobileControls{
      position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:25;display:none;gap:10px
    }
    .ctrl{width:58px;height:58px;border:none;border-radius:18px;background:rgba(0,0,0,.35);color:#fff;font-size:24px;backdrop-filter:blur(8px);cursor:pointer}
    .flash{animation:hit .16s 1}
    @keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.06)}}
    @keyframes hit{0%{filter:brightness(1)}50%{filter:brightness(1.8)}100%{filter:brightness(1)}}
    @media (max-width:900px){
      .panel h1{font-size:36px}.panel p{font-size:16px}.tips{grid-template-columns:1fr}.mobileControls{display:flex}
      .logo{font-size:20px}.value{font-size:22px}.card{min-width:92px}
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="logo">SNG <span>Subway Runner Pro</span></div>
    <div class="stats">
      <div class="card"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="card"><div class="label">Best</div><div class="value" id="best">0</div></div>
      <div class="card"><div class="label">Pièces</div><div class="value" id="coins">0</div></div>
      <div class="card"><div class="label">Distance</div><div class="value" id="distance">0</div></div>
    </div>
  </div>

  <div id="game">
    <div class="sky"></div>
    <div class="buildings" id="buildings"></div>
    <div class="trackWrap" id="trackWrap">
      <div class="laneMark" style="left:33.33%"></div>
      <div class="laneMark" style="left:66.66%"></div>
    </div>

    <div class="player" id="player">
      <div class="shieldAura" id="shieldAura" style="display:none"></div>
      <div class="head"></div>
      <div class="hood"></div>
      <div class="body"></div>
      <div class="legs"></div>
      <div class="armL"></div>
      <div class="armR"></div>
      <div class="legL"></div>
      <div class="legR"></div>
    </div>

    <div class="overlay" id="startOverlay">
      <div class="panel">
        <h1><span>SNG</span> Runner</h1>
        <p>Version ultra pro style Subway Surfers pour ton site. Esquive les trains, prends les pièces et fais exploser le score.</p>
        <div class="tips">
          <div class="tip">← → : changer de voie</div>
          <div class="tip">↑ : sauter</div>
          <div class="tip">↓ : glisser</div>
        </div>
        <button class="btn" id="playBtn">JOUER MAINTENANT</button>
      </div>
    </div>

    <div class="overlay" id="gameOverOverlay" style="display:none">
      <div class="panel">
        <h1>Fin <span>de course</span></h1>
        <p id="finalText">Ton score est prêt.</p>
        <button class="btn" id="restartBtn">REJOUER</button>
      </div>
    </div>
  </div>

  <div class="mobileControls">
    <button class="ctrl" id="leftBtn">◀</button>
    <button class="ctrl" id="upBtn">▲</button>
    <button class="ctrl" id="downBtn">▼</button>
    <button class="ctrl" id="rightBtn">▶</button>
  </div>

  <script>
    const game = document.getElementById('game');
    const trackWrap = document.getElementById('trackWrap');
    const player = document.getElementById('player');
    const shieldAura = document.getElementById('shieldAura');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const coinsEl = document.getElementById('coins');
    const distanceEl = document.getElementById('distance');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalText = document.getElementById('finalText');
    const buildings = document.getElementById('buildings');

    const lanes = [0.18, 0.5, 0.82];
    const objects = [];
    let started = false;
    let gameOver = false;
    let lane = 1;
    let score = 0;
    let coins = 0;
    let distance = 0;
    let speed = 8;
    let jump = false;
    let slide = false;
    let shield = false;
    let magnet = false;
    let shieldTimer = 0;
    let magnetTimer = 0;
    let spawnTimer = 0;
    let best = Number(localStorage.getItem('sng-subway-best') || 0);
    bestEl.textContent = best;

    function makeBuildings(){
      buildings.innerHTML='';
      for(let i=0;i<18;i++){
        const b=document.createElement('div');
        b.className='building';
        b.style.left=(i*5.5)+'%';
        b.style.width=(40+((i*13)%35))+'px';
        b.style.height=(90+((i*31)%150))+'px';
        const w=document.createElement('div');
        w.className='windows';
        for(let j=0;j<15;j++){const s=document.createElement('span');w.appendChild(s)}
        b.appendChild(w);buildings.appendChild(b);
      }
    }

    function laneX(index){
      return trackWrap.offsetLeft + trackWrap.offsetWidth * lanes[index] - 42;
    }

    function updatePlayer(){
      player.style.left = laneX(lane) + 'px';
      player.style.bottom = (jump ? 210 : slide ? 95 : 115) + 'px';
      player.style.transform = slide ? 'scaleY(0.72)' : 'scaleY(1)';
      shieldAura.style.display = shield ? 'block' : 'none';
    }

    function makeRailLines(){
      document.querySelectorAll('.rail').forEach(e=>e.remove());
      for(let i=0;i<11;i++){
        const r=document.createElement('div');
        r.className='rail';
        r.style.bottom=(i*68)+'px';
        r.style.width=(220+i*48)+'px';
        r.style.height=(34+i*10)+'px';
        trackWrap.appendChild(r);
      }
    }

    function spawnObject(){
      const typeRand = Math.random();
      const obj = document.createElement('div');
      const laneId = Math.floor(Math.random()*3);
      let kind = 'coin';
      if(typeRand < 0.17) kind = 'train';
      else if(typeRand < 0.29) kind = 'barrier';
      else if(typeRand < 0.38) kind = 'cone';
      else if(typeRand < 0.42) kind = Math.random() < .5 ? 'magnet' : 'shield';

      obj.dataset.kind = kind;
      obj.dataset.lane = laneId;
      obj.dataset.depth = 100;

      if(kind === 'coin'){
        obj.className = 'coin';
        obj.textContent = 'S';
      }else if(kind === 'magnet' || kind === 'shield'){
        obj.className = 'power ' + kind;
        obj.textContent = kind === 'magnet' ? '⚡' : '🛡';
      }else{
        obj.className = 'obstacle ' + kind;
        if(kind === 'train'){obj.style.width='115px';obj.style.height='190px';}
        if(kind === 'barrier'){obj.style.width='74px';obj.style.height='68px';}
        if(kind === 'cone'){obj.style.width='52px';obj.style.height='52px';}
      }

      trackWrap.appendChild(obj);
      objects.push(obj);
    }

    function renderObjects(dt){
      for(let i=objects.length-1;i>=0;i--){
        const obj = objects[i];
        let depth = parseFloat(obj.dataset.depth);
        depth -= speed * dt * 0.9;
        obj.dataset.depth = depth;

        const scale = Math.max(0.35, 1.55 - depth / 85);
        const laneId = Number(obj.dataset.lane);
        const x = trackWrap.offsetWidth * lanes[laneId];
        const y = 60 + (100-depth) * 7.2;

        obj.style.left = `calc(${x}px - ${obj.offsetWidth/2}px)`;
        obj.style.top = y + 'px';
        obj.style.transform = `scale(${scale})`;
        obj.style.zIndex = Math.floor(1000 - depth);

        const hitZone = depth < 18 && depth > 4 && laneId === lane;
        const nearMagnet = magnet && depth < 28 && Math.abs(laneId - lane) <= 1;

        if(obj.dataset.kind === 'coin' && nearMagnet){
          coins += 1; score += 25; obj.remove(); objects.splice(i,1); continue;
        }

        if(hitZone){
          if(obj.dataset.kind === 'coin'){
            coins += 1; score += 25; obj.remove(); objects.splice(i,1); continue;
          }
          if(obj.dataset.kind === 'magnet'){
            magnet = true; magnetTimer = 7000; obj.remove(); objects.splice(i,1); continue;
          }
          if(obj.dataset.kind === 'shield'){
            shield = true; shieldTimer = 7000; obj.remove(); objects.splice(i,1); continue;
          }
          if(obj.dataset.kind === 'cone' && jump){ obj.remove(); objects.splice(i,1); continue; }
          if(obj.dataset.kind === 'barrier' && slide){ obj.remove(); objects.splice(i,1); continue; }
          if(obj.dataset.kind === 'train' && jump){ endGame(); return; }
          if(obj.dataset.kind === 'train' || obj.dataset.kind === 'barrier' || obj.dataset.kind === 'cone'){
            if(shield){
              shield = false; shieldTimer = 0; obj.remove(); objects.splice(i,1); continue;
            }
            endGame(); return;
          }
        }

        if(depth <= 0){ obj.remove(); objects.splice(i,1); }
      }
    }

    function endGame(){
      gameOver = true;
      started = false;
      if(score > best){
        best = score;
        localStorage.setItem('sng-subway-best', best);
        bestEl.textContent = best;
      }
      game.classList.add('flash');
      setTimeout(()=>game.classList.remove('flash'), 160);
      finalText.textContent = `Score : ${score} | Pièces : ${coins} | Distance : ${Math.floor(distance)} m`;
      gameOverOverlay.style.display = 'flex';
    }

    function resetGame(){
      objects.forEach(o=>o.remove());
      objects.length = 0;
      started = false;
      gameOver = false;
      lane = 1;
      score = 0;
      coins = 0;
      distance = 0;
      speed = 8;
      jump = false;
      slide = false;
      shield = false;
      magnet = false;
      shieldTimer = 0;
      magnetTimer = 0;
      spawnTimer = 0;
      scoreEl.textContent = 0;
      coinsEl.textContent = 0;
      distanceEl.textContent = 0;
      gameOverOverlay.style.display = 'none';
      startOverlay.style.display = 'flex';
      updatePlayer();
    }

    function startGame(){
      if(gameOver) return;
      started = true;
      startOverlay.style.display = 'none';
    }

    function jumpAction(){
      if(!started || jump) return;
      jump = true; updatePlayer();
      setTimeout(()=>{jump=false;updatePlayer()}, 550);
    }
    function slideAction(){
      if(!started || slide) return;
      slide = true; updatePlayer();
      setTimeout(()=>{slide=false;updatePlayer()}, 480);
    }
    function leftAction(){ if(started && lane>0){lane--;updatePlayer();} }
    function rightAction(){ if(started && lane<2){lane++;updatePlayer();} }

    document.getElementById('playBtn').onclick = startGame;
    document.getElementById('restartBtn').onclick = resetGame;
    document.getElementById('leftBtn').onclick = leftAction;
    document.getElementById('rightBtn').onclick = rightAction;
    document.getElementById('upBtn').onclick = jumpAction;
    document.getElementById('downBtn').onclick = slideAction;

    window.addEventListener('keydown', (e)=>{
      if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
      if(!started && (e.key === ' ' || e.key === 'Enter')) startGame();
      if(e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') leftAction();
      if(e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') rightAction();
      if(e.key === 'ArrowUp' || e.key.toLowerCase() === 'w' || e.key === ' ') jumpAction();
      if(e.key === 'ArrowDown' || e.key.toLowerCase() === 's') slideAction();
    });

    let last = 0;
    function loop(t){
      const dt = Math.min((t-last)/16.666,1.5) || 1;
      last = t;
      if(started && !gameOver){
        score += Math.floor(speed * dt);
        distance += speed * dt * 0.7;
        speed = Math.min(speed + 0.0025 * dt, 16);
        spawnTimer += dt;
        if(spawnTimer > 16){
          spawnObject();
          if(Math.random() < 0.55) spawnObject();
          spawnTimer = 0;
        }
        if(shieldTimer > 0){ shieldTimer -= 16.666 * dt; if(shieldTimer <= 0) shield = false; }
        if(magnetTimer > 0){ magnetTimer -= 16.666 * dt; if(magnetTimer <= 0) magnet = false; }
        renderObjects(dt);
        scoreEl.textContent = score;
        coinsEl.textContent = coins;
        distanceEl.textContent = Math.floor(distance);
      }
      requestAnimationFrame(loop);
    }

    window.addEventListener('resize', ()=>{updatePlayer();makeRailLines();});
    makeBuildings();
    makeRailLines();
    updatePlayer();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
